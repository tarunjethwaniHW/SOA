# HELOC Approval Client - Spring WS WebServiceTemplate Configuration
server.port=10080

# Application name
spring.application.name=heloc-approval-client

# SOA Suite endpoint (WebServiceTemplate target)
soap.endpoint.heloc-approval=http://localhost:10081/soap/HelocApprovalProcess

# Logging
logging.level.com.unified.mortgage.heloc.client=DEBUG
logging.level.org.springframework.ws=DEBUG

# WSDL validation is configured in SoapClientConfig.java
# Schema: heloc-service-soa/HelocApprovalProcess.wsdl
